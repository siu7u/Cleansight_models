version: 1

defaults:
  python: current

profiles:
  yolo_pipeline:
    family: yolo
    adapter: yolo_pipeline
    workdir: yolo-detection/pipeline
    input:
      format: ultralytics-yolo
    output:
      checkpoint: runs/{target}/weights/best.pt
      report: runs/{target}/acceptance_report.md
    commands:
      train: [03_train.py, "{target}"]
      eval: [04_validate.py, "{target}"]
      pipeline:
        - [00_status.py]
        - [01_pull_data.py]
        - [00_status.py, --assign]
        - [02_build_dataset.py]
        - [03_train.py, "{target}"]
        - [04_validate.py, "{target}"]

  temporal_legacy_20d:
    family: temporal
    adapter: temporal_main
    input:
      feature_mapping: legacy-20d-v1
      input_dim: 20
      window: 64
      labels: [Idle, Long_Brushing, Short_Brushing]
    output:
      report: REPORT.md
      card: CARD.md
      pin: pin.yaml
    evaluation:
      testset_id: temporal.endo-project-v1.test
      inference_mode: raw_last_frame
    commands:
      train:
        - main.py
        - --mode
        - full
        - --epochs
        - "10"
        - --window
        - "64"
        - --verbose
        - --output_dir
        - experiments/{target}
      eval:
        - tools/eval_temporal_detailed.py
        - --repo
        - "{workdir}"
        - --model
        - "{target}"
        - --checkpoint
        - "{checkpoint}"

models:
  - id: yolo.group1_large
    profile: yolo_pipeline
    target: group1_large
    input:
      dataset: datasets/group1_large/data.yaml
      labels: [hand, scope_control_body, scope_mid_section]
    evaluation:
      testset_id: yolo.group1_large.test
      inference_mode: detection

  - id: yolo.group2_small
    profile: yolo_pipeline
    target: group2_small
    input:
      dataset: datasets/group2_small/data.yaml
      labels: [syringe, air_gun, scope_distal_end]
    evaluation:
      testset_id: yolo.group2_small.test
      inference_mode: detection

  - id: temporal.gru
    profile: temporal_legacy_20d
    workdir: temporal-gru
    target: gru
    output:
      checkpoint: registry/gru-v1/gru-final-20260704-150629.pt

  - id: temporal.tcn
    profile: temporal_legacy_20d
    workdir: temporal-causal-tcn
    target: tcn
    output:
      checkpoint: registry/tcn-v1/tcn-final-20260704-160652.pt

  - id: temporal.transformer
    profile: temporal_legacy_20d
    workdir: temporal-transformer
    target: transformer
    output:
      checkpoint: registry/transformer-v1/transformer-final-20260704-161653.pt

benchmarks:
  single_model_yolo:
    command: [benchmark/single_model/run_yolo_benchmark.py, --skip-run]
  single_model_temporal:
    command: [benchmark/single_model/run_temporal_benchmark.py]
  temporal_feed_mode:
    command: [benchmark/temporal_feed_mode/run_feed_mode_benchmark.py]
