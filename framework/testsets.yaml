schema_version: 2
root: ..

# 数据集级公共契约：类别、特征和数据根目录只维护一次。
# split_overlap_policy: error  # 同一源视频不能跨 split
# split_overlap_policy: frame  # 允许同源视频，但具体帧不能重合
# split_overlap_policy: allow  # 完全不检查跨 split 重叠

datasets:
  temporal.actionmixed-v2:
    family: temporal
    format: actionmixed_bbox
    dataset_version: cleansight-actionmixed-v2
    revision: b3cf7487f6f6fd6e5be404f8e72b24f82ebb73b4
    data_root: datasets/cleansight-ActionMixed
    feature_mapping: actionmixed-bbox-8cls-v1
    input_dim: 40
    labels: [idle, air_injection, flush, long_brush_insert, long_brush_withdraw, short_brush_cleaning]
    split_overlap_policy: frame

  # 自动标注数据通道（YOLO 推理检测框 + 人工动作标签），与手动标注 actionmixed-v2 并存。
  # 2026-08-28 升 v3：数据源换为 Label Studio project-16 导出（18 个 2026-08 新录视频，
  # train 13 / val 3 / test 2，test 锚定团队指定 task#195/#199）；动作标签随 LS 更名
  # air_injection → water_injection（id 位置不变）；检测源仍为 yolo11s-g1-v1/yolo11s-g2-v1
  # （8 类全非零）；附 task_ids.yaml 溯源。旧 v2 指标不可比，v2 数据备份于本地 -v2-backup。
  # 背景：docs/TEMPORAL_DATASET_TRANSFORMATION_PLAN.md；revision 为三个 split manifest
  # 拼接内容的 sha256（b7edb874… 为 README 展示前缀）。
  # 2026-09-03 同步 ModelScope HEAD（cd585c5）：train task#204（67aa31ca…）审核后修正
  # sbc 标注（39→48 帧，10 帧 idle→sbc + 1 帧 sbc→idle）；仅 train 标签变化，manifest
  # 不变故 revision 不变，train split 内容指纹已更新（旧 checkpoint 的 resume 会按指纹
  # 拒绝——符合设计）；旧标签备份于数据目录 labels_backup_task204fix/。
  temporal.actionmixed-auto-v3:
    family: temporal
    format: actionmixed_bbox
    dataset_version: cleansight-actionmixed-auto-v3
    revision: b7edb8749b0794bf7513ada250897e59eccb0ac0bea00287574e8f22b2f218d3
    data_root: datasets/cleansight-ActionMixed-auto
    feature_mapping: actionmixed-bbox-8cls-v1
    input_dim: 40
    labels: [idle, water_injection, flush, long_brush_insert, long_brush_withdraw, short_brush_cleaning]
    split_overlap_policy: frame

  # ROI 空间特征版（同一份原始数据、不同的特征契约）：feature_mapping=
  # actionmixed-roi-grid-v1 把画面按 2×3 网格分区，对每 (检测类, 区域) 统计
  # [presence, count, max_area]，8 类 × 6 区域 × 3 通道 = 144 维（recipe 见
  # framework/cleansight_eval/temporal/features/roi_bbox.py）。revision 与 v3 相同
  # （原始数据未变），dataset_version 独立以便与 40 维基线对照训练；feature_layout
  # 与 feature_mapping 一起构成 catalog 侧对该契约的声明，必须与 recipe 实现一致。
  temporal.actionmixed-auto-roi-v1:
    family: temporal
    format: actionmixed_bbox
    dataset_version: cleansight-actionmixed-auto-roi-v1
    revision: b7edb8749b0794bf7513ada250897e59eccb0ac0bea00287574e8f22b2f218d3
    data_root: datasets/cleansight-ActionMixed-auto
    feature_mapping: actionmixed-roi-grid-v1
    feature_layout: {rows: 2, cols: 3, channels: 3}
    input_dim: 144
    labels: [idle, water_injection, flush, long_brush_insert, long_brush_withdraw, short_brush_cleaning]
    split_overlap_policy: frame

  # 手部区域特征版（同一份原始数据）：feature_mapping=actionmixed-bbox-hand-8cls-v1
  # 只编码中心落在"面积最大 hand 框扩张 1.5 倍"区域内的框（坐标相对该区域归一化），
  # 仍为 8×5=40 维；无 hand 框时全零（见 features/hand_bbox.py）。
  temporal.actionmixed-auto-hand-v1:
    family: temporal
    format: actionmixed_bbox
    dataset_version: cleansight-actionmixed-auto-hand-v1
    revision: b7edb8749b0794bf7513ada250897e59eccb0ac0bea00287574e8f22b2f218d3
    data_root: datasets/cleansight-ActionMixed-auto
    feature_mapping: actionmixed-bbox-hand-8cls-v1
    input_dim: 40
    labels: [idle, water_injection, flush, long_brush_insert, long_brush_withdraw, short_brush_cleaning]
    split_overlap_policy: frame

  # "全局+手部"双通道版：feature_mapping=actionmixed-bbox-global-hand-8cls-v1 为
  # 全局 40 维与手部 40 维拼接（80 维，feature_blocks=2 声明每类 10 维块）。
  temporal.actionmixed-auto-global-hand-v1:
    family: temporal
    format: actionmixed_bbox
    dataset_version: cleansight-actionmixed-auto-global-hand-v1
    revision: b7edb8749b0794bf7513ada250897e59eccb0ac0bea00287574e8f22b2f218d3
    data_root: datasets/cleansight-ActionMixed-auto
    feature_mapping: actionmixed-bbox-global-hand-8cls-v1
    feature_blocks: 2
    input_dim: 80
    labels: [idle, water_injection, flush, long_brush_insert, long_brush_withdraw, short_brush_cleaning]
    split_overlap_policy: frame

  temporal.endo-project-v1:
    family: temporal
    dataset_version: endo-project-v1
    data_root: datasets/endo-project-v1
    feature_mapping: legacy-20d-v1
    input_dim: 20
    labels: [Idle, Long_Brushing, Short_Brushing]

  yolo.group1_large-v1:
    family: yolo
    dataset_version: cleansight-yolo-v1
    manifest: datasets/cleansight-yolo/group1_large/data.yaml
    feature_mapping: yolo-bbox-group1-v1
    input_dim: 3
    labels: [hand, scope_control_body, scope_mid_section]
    split_overlap_policy: frame

  yolo.group2_small-v1:
    family: yolo
    dataset_version: cleansight-yolo-v1
    manifest: datasets/cleansight-yolo/group2_small/data.yaml
    feature_mapping: yolo-bbox-group2-v2
    input_dim: 5
    labels: [syringe, air_gun, scope_distal_end, short_brush, brush_tip_out]
    split_overlap_policy: frame

  e2e.clean-example-v1:
    family: e2e
    dataset_version: clean-e2e-example-v1
    manifest: benchmark/e2e_3min/cases/example.yaml
    feature_mapping: action-timeline-v1
    input_dim: null
    labels: [Long_Brushing, Short_Brushing]

# Split 级定义：只保留集合身份、样本清单和评测用途。
testsets:
  temporal.actionmixed-v2.train:
    dataset: temporal.actionmixed-v2
    split: train
    manifest: benchmark/manifests/actionmixed/train.txt
    purpose: training_only

  temporal.actionmixed-v2.val:
    dataset: temporal.actionmixed-v2
    split: val
    manifest: benchmark/manifests/actionmixed/val.txt
    purpose: validation_only

  temporal.actionmixed-v2.test:
    dataset: temporal.actionmixed-v2
    split: test
    manifest: benchmark/manifests/actionmixed/test.txt
    purpose: development_benchmark_frame_disjoint

  temporal.actionmixed-auto-v3.train:
    dataset: temporal.actionmixed-auto-v3
    split: train
    manifest: benchmark/manifests/actionmixed-auto/train.txt
    purpose: training_only

  temporal.actionmixed-auto-v3.val:
    dataset: temporal.actionmixed-auto-v3
    split: val
    manifest: benchmark/manifests/actionmixed-auto/val.txt
    purpose: validation_only

  temporal.actionmixed-auto-v3.test:
    dataset: temporal.actionmixed-auto-v3
    split: test
    manifest: benchmark/manifests/actionmixed-auto/test.txt
    purpose: development_benchmark_frame_disjoint

  temporal.actionmixed-auto-roi-v1.train:
    dataset: temporal.actionmixed-auto-roi-v1
    split: train
    manifest: benchmark/manifests/actionmixed-auto/train.txt
    purpose: training_only

  temporal.actionmixed-auto-roi-v1.val:
    dataset: temporal.actionmixed-auto-roi-v1
    split: val
    manifest: benchmark/manifests/actionmixed-auto/val.txt
    purpose: validation_only

  temporal.actionmixed-auto-roi-v1.test:
    dataset: temporal.actionmixed-auto-roi-v1
    split: test
    manifest: benchmark/manifests/actionmixed-auto/test.txt
    purpose: development_benchmark_frame_disjoint

  temporal.actionmixed-auto-hand-v1.train:
    dataset: temporal.actionmixed-auto-hand-v1
    split: train
    manifest: benchmark/manifests/actionmixed-auto/train.txt
    purpose: training_only

  temporal.actionmixed-auto-hand-v1.val:
    dataset: temporal.actionmixed-auto-hand-v1
    split: val
    manifest: benchmark/manifests/actionmixed-auto/val.txt
    purpose: validation_only

  temporal.actionmixed-auto-hand-v1.test:
    dataset: temporal.actionmixed-auto-hand-v1
    split: test
    manifest: benchmark/manifests/actionmixed-auto/test.txt
    purpose: development_benchmark_frame_disjoint

  temporal.actionmixed-auto-global-hand-v1.train:
    dataset: temporal.actionmixed-auto-global-hand-v1
    split: train
    manifest: benchmark/manifests/actionmixed-auto/train.txt
    purpose: training_only

  temporal.actionmixed-auto-global-hand-v1.val:
    dataset: temporal.actionmixed-auto-global-hand-v1
    split: val
    manifest: benchmark/manifests/actionmixed-auto/val.txt
    purpose: validation_only

  temporal.actionmixed-auto-global-hand-v1.test:
    dataset: temporal.actionmixed-auto-global-hand-v1
    split: test
    manifest: benchmark/manifests/actionmixed-auto/test.txt
    purpose: development_benchmark_frame_disjoint

  temporal.endo-project-v1.train:
    dataset: temporal.endo-project-v1
    split: train
    manifest: datasets/endo-project-v1/splits/train.split1.bundle
    purpose: training_only
    expected_items:
      - export9
      - export14
      - export4
      - export13
      - export18
      - export3
      - export5
      - export8
      - export15-480P
      - export20
      - export7-480p
      - export19
      - export10
      - export2
      - export11
      - export6

  temporal.endo-project-v1.test:
    dataset: temporal.endo-project-v1
    split: test
    manifest: datasets/endo-project-v1/splits/test.split1.bundle
    purpose: locked_holdout_benchmark
    expected_items:
      - export16-480P
      - export17
      - export1
