schema_version: 2
root: ..

# 数据集级公共契约：类别、特征和数据根目录只维护一次。
# split_overlap_policy: error  # 同一源视频不能跨 split
# split_overlap_policy: frame  # 允许同源视频，但具体帧不能重合
# split_overlap_policy: allow  # 完全不检查跨 split 重叠

datasets:
  temporal.actionmixed-v2:
    family: temporal
    format: actionmixed_bbox
    dataset_version: cleansight-actionmixed-v2
    revision: b3cf7487f6f6fd6e5be404f8e72b24f82ebb73b4
    data_root: datasets/cleansight-ActionMixed
    feature_mapping: actionmixed-bbox-8cls-v1
    input_dim: 40
    labels: [idle, air_injection, flush, long_brush_insert, long_brush_withdraw, short_brush_cleaning]
    split_overlap_policy: frame

  # 图像 embedding 契约（形态 B 第一步，机制床）：feature_mapping=
  # actionmixed-bbox-embed-mbv3s-v1 = 左侧 40 维 bbox 块（同 actionmixed-bbox-8cls-v1）+
  # 右侧 576 维逐帧整图 mobilenet_v3_small embedding = 616 维（recipe 见
  # framework/cleansight_eval/temporal/features/image_embed.py）。revision 与
  # actionmixed-v2 相同（原始数据未变），dataset_version 独立以便与 40 维基线对照训练。
  # feature_embed.root 是该契约的 embedding 产物根目录（extract_embeddings.py 输出，
  # 换 backbone / 换数据源只改这里或换登记条目，不改代码）；catalog 据此校验
  # 「检测类数×5 + feat_dim == input_dim」并核对每个样本的 .npy 存在。
  temporal.actionmixed-v2-embed-mbv3s-v1:
    family: temporal
    format: actionmixed_bbox
    dataset_version: cleansight-actionmixed-v2-embed-mbv3s-v1
    revision: b3cf7487f6f6fd6e5be404f8e72b24f82ebb73b4
    data_root: datasets/cleansight-ActionMixed
    feature_mapping: actionmixed-bbox-embed-mbv3s-v1
    feature_embed:
      root: datasets/cleansight-ActionMixed/embeddings/mobilenet_v3_small-v1
      feat_dim: 576
      backbone: mobilenet_v3_small
    input_dim: 616
    labels: [idle, air_injection, flush, long_brush_insert, long_brush_withdraw, short_brush_cleaning]
    split_overlap_policy: frame

  # 自动标注数据通道（YOLO 推理检测框 + 人工动作标签），与手动标注 actionmixed-v2 并存。
  # 2026-08-28 升 v3：数据源换为 Label Studio project-16 导出（18 个 2026-08 新录视频，
  # train 13 / val 3 / test 2，test 锚定团队指定 task#195/#199）；动作标签随 LS 更名
  # air_injection → water_injection（id 位置不变）；检测源仍为 yolo11s-g1-v1/yolo11s-g2-v1
  # （8 类全非零）；附 task_ids.yaml 溯源。旧 v2 指标不可比，v2 数据备份于本地 -v2-backup。
  # 背景：docs/TEMPORAL_DATASET_TRANSFORMATION_PLAN.md；revision 为三个 split manifest
  # 拼接内容的 sha256（b7edb874… 为 README 展示前缀）。
  # 2026-09-03 同步 ModelScope HEAD（cd585c5）：train task#204（67aa31ca…）审核后修正
  # sbc 标注（39→48 帧，10 帧 idle→sbc + 1 帧 sbc→idle）；仅 train 标签变化，manifest
  # 不变故 revision 不变，train split 内容指纹已更新（旧 checkpoint 的 resume 会按指纹
  # 拒绝——符合设计）；旧标签备份于原官方目录 datasets/cleansight-ActionMixed-auto/
  # labels_backup_task204fix/（当前 data_root 为 -lhh 克隆目录，不含该备份）。
  # 2026-09-05 同步（HEAD 6e78b075，数据集 README 记 v3(09-05)）：val 重划（#202→train、
  # #205→val）并再次取消 test（#195→train、#199→val）→ train 14 / val 4 / 无 test。
  # 当时 manifest 未跟着重划，出现过 manifest(13/3/2) 与数据本体(14/4/0) 不一致的空窗，
  # 2026-09-17 一并修正。该版数据集 README 自报 revision 7b039550（仅 train+val 口径），
  # 与本仓库配方不同且未能在本地复现，消费侧一律以本条目 revision 为准。
  # 2026-09-17 同步 ModelScope HEAD（37cc70fd）恢复 test：project-18（action-test）
  # task#213-220 共 8 视频 2,639 帧并入主树 labels/test + frames/test，train/val 一字未动；
  # test 与 train/val 来自不同录制批次（project-18 vs project-16），逐类分布 idle 1,458、
  # water_injection 0、flush 164、lb_insert 707、lb_withdraw 259、sbc 51 —— **test 无
  # water_injection 帧，该 split 不能用于 water 类评测**；manifest 重划为 14/4/8，revision
  # 按三 split manifest 拼接 sha256 重算（该配方可精确复现重算前的 b7edb874…）。
  # 上游 task_ids.yaml 第 14 行 8634f3bc 视频名有一位数笔误（…8882820… vs 数据文件
  # …8887820…，579 帧），manifest 以 labels/<split> 目录为准，待上游修正。
  temporal.actionmixed-auto-v3:
    family: temporal
    format: actionmixed_bbox
    dataset_version: cleansight-actionmixed-auto-v3
    revision: 6375eba95c28b206207e607bb407f45ab589cda0015305df635aa9f686e1b3ad
    data_root: datasets/cleansight-ActionMixed-auto-lhh
    feature_mapping: actionmixed-bbox-8cls-v1
    input_dim: 40
    labels: [idle, water_injection, flush, long_brush_insert, long_brush_withdraw, short_brush_cleaning]
    split_overlap_policy: frame

  # ROI 空间特征版（同一份原始数据、不同的特征契约）：feature_mapping=
  # actionmixed-roi-grid-v1 把画面按 2×3 网格分区，对每 (检测类, 区域) 统计
  # [presence, count, max_area]，8 类 × 6 区域 × 3 通道 = 144 维（recipe 见
  # framework/cleansight_eval/temporal/features/roi_bbox.py）。revision 与 v3 相同
  # （原始数据未变），dataset_version 独立以便与 40 维基线对照训练；feature_layout
  # 与 feature_mapping 一起构成 catalog 侧对该契约的声明，必须与 recipe 实现一致。
  temporal.actionmixed-auto-roi-v1:
    family: temporal
    format: actionmixed_bbox
    dataset_version: cleansight-actionmixed-auto-roi-v1
    revision: 6375eba95c28b206207e607bb407f45ab589cda0015305df635aa9f686e1b3ad
    data_root: datasets/cleansight-ActionMixed-auto-lhh
    feature_mapping: actionmixed-roi-grid-v1
    feature_layout: {rows: 2, cols: 3, channels: 3}
    input_dim: 144
    labels: [idle, water_injection, flush, long_brush_insert, long_brush_withdraw, short_brush_cleaning]
    split_overlap_policy: frame

  # **跨来源合并训练集**（2026-09-29 新增，帧准确率攻关第 2 轮）：把自动标注数据
  # （auto-lhh，Label Studio project-16，14 视频 / 9,575 帧）与手动标注数据
  # （`datasets/cleansight-ActionMixed`，16 视频 / 9,532 帧）合成**同构目录**当一个训练集用；
  # 两者视频 stem 零交集（构建脚本内置断言），不会互相覆盖。
  #
  # 动机：旗舰在 8 视频 test 上的 acc 53.92 **低于**平凡基线（全 idle 55.25），误差分解显示
  # 动作帧被判 idle 786/1181；两个失效模式都指向训练数据——① 跨批次（train/val 是
  # project-16 的 2026-08 录制，test 是 project-18 的 2026-09「长短毛刷」专项）；
  # ② 先验偏 idle（auto train idle 65.5% vs test 55.2%）。手动集 idle 只占 **25.6%**，
  # 合并后 train 的 idle 降到 **45.6%**（30 视频 / 19,107 帧，帧数为 auto-only 的 2 倍）。
  #
  # **val / test 与 `temporal.actionmixed-auto-roi-v1` 逐字节相同**（目录符号链接 + 同一批
  # manifest），所以选点口径（`best_metric=val_edit`）与验收口径同基线严格可比，是单变量对照。
  # 手动集自身的 train/val/test 是**同一视频的不同帧区间**，并入 train 时按 stem 取并集
  # （脚本断言帧号零重叠）。
  #
  # 产物是派生物、可随时重跑：`python tools/build_union_temporal_dataset.py`（只读原始数据集）。
  # revision 口径同其它条目 = 三个 split manifest 拼接内容的 sha256（union train + auto val + auto test）。
  temporal.actionmixed-union-roi-v1:
    family: temporal
    format: actionmixed_bbox
    dataset_version: cleansight-actionmixed-union-roi-v1
    revision: 983ba4f470b507a81ea8d396de63d30411917b01eb65bd302536987c0462de38
    data_root: datasets/cleansight-ActionMixed-union
    feature_mapping: actionmixed-roi-grid-v1
    feature_layout: {rows: 2, cols: 3, channels: 3}
    input_dim: 144
    labels: [idle, water_injection, flush, long_brush_insert, long_brush_withdraw, short_brush_cleaning]
    split_overlap_policy: frame

  # 带**时间导数**的 ROI 契约：在 roi-grid-144 的每 (检测类, 区域) 三通道
  # [presence, count, max_area] 之后追加 [d_count, d_max_area] 两个前向差分通道，
  # 8 类 × 6 区域 × 5 通道 = 240 维（recipe 见
  # framework/cleansight_eval/temporal/features/roi_bbox.py::build_roi_grid_delta_features）。
  # 动机：现行 ROI-144 只有**瞬时**统计量、完全没有时间导数，而 insert/withdraw 的
  # 判别量正是"方向"；文献（Funke et al., MICCAI 2019）在同样"帧准确率不动、段级指标
  # 大涨"的形态下验证过加时空内容的价值（edit 41.4→64.0）。
  # **因果但有状态**：Δ 只依赖当前帧与前一帧，可流式计算，但需保留 1 帧状态，
  # 与 roi-grid-v1 的"逐帧独立、无状态"不同；离线/在线必须用同一份差分口径。
  # revision 与 v1 相同（原始数据未变），dataset_version 独立以便与 144 维对照训练。
  temporal.actionmixed-auto-roi-delta-v1:
    family: temporal
    format: actionmixed_bbox
    dataset_version: cleansight-actionmixed-auto-roi-delta-v1
    revision: 6375eba95c28b206207e607bb407f45ab589cda0015305df635aa9f686e1b3ad
    data_root: datasets/cleansight-ActionMixed-auto-lhh
    feature_mapping: actionmixed-roi-grid-delta-v1
    feature_layout: {rows: 2, cols: 3, channels: 5}
    input_dim: 240
    labels: [idle, water_injection, flush, long_brush_insert, long_brush_withdraw, short_brush_cleaning]
    split_overlap_policy: frame

  # ROI presence 平面版（同一份原始数据、不同的特征契约）：feature_mapping=
  # actionmixed-roi-grid-presence-v1 只保留 roi-grid-v1 的 **presence 通道**（丢弃 count /
  # max_area），8 类 × 6 区域 × 1 通道 = 48 维（recipe 见
  # framework/cleansight_eval/temporal/features/roi_bbox.py::build_roi_presence_frame_features）。
  # 设计依据：docs/FEATURE_STRATEGY_COMPARE.md 第十七轮 §17.4——roi-144 三通道高度冗余
  # （逐 (类,区域) |Pearson r| = 0.990/0.926/0.920），且 insert / short_brush_cleaning 的判别
  # 信号集中在 presence（LDA 探针 presence-only 48 维 edit 14.60 > 全量 144 维 9.01）。
  # revision 与 v3 相同（原始数据未变），dataset_version 独立以便与 v1(144) 对照；
  # 均匀契约（每类 6 维），遮罩块宽按 48÷8=6 自动推导。
  temporal.actionmixed-auto-roi-presence-v1:
    family: temporal
    format: actionmixed_bbox
    dataset_version: cleansight-actionmixed-auto-roi-presence-v1
    revision: 6375eba95c28b206207e607bb407f45ab589cda0015305df635aa9f686e1b3ad
    data_root: datasets/cleansight-ActionMixed-auto-lhh
    feature_mapping: actionmixed-roi-grid-presence-v1
    feature_layout: {rows: 2, cols: 3, channels: 1}
    input_dim: 48
    labels: [idle, water_injection, flush, long_brush_insert, long_brush_withdraw, short_brush_cleaning]
    split_overlap_policy: frame

  # ROI 可见性重排版（同一份原始数据、不同的特征契约）：feature_mapping=
  # actionmixed-roi-grid-v2 不再"按类别表整齐分配"，而是按实测可见性分配维度预算——
  # 高频 3 类（hand / scope_control_body / scope_mid_section，出现率 95.2/91.4/69.8%）
  # 用 3×3 网格提高空间分辨率（每类 27 维），低频 5 类（scope_distal_end / syringe /
  # air_gun / short_brush / brush_tip_out）合并为全局 1 区域（每类 3 维）→ 8 类共 96 维
  # （recipe 见 framework/cleansight_eval/temporal/features/roi_bbox_v2.py；设计依据
  # docs/features/INPUT_DESIGN_PROPOSAL.md §1.1 覆盖、§1.3 通道体检（v1 有 54/144 恒零）、
  # §2 P2b）。revision 与 v3 相同（原始数据未变），dataset_version 独立以便与 v1(144) 对照；
  # **每类块宽不等（27/3）**，feature_layout.groups 声明分组供 catalog 校验总维度，
  # 遮罩/随机遮罩必须按 features.roi_grid_v2_block_dims 的显式块宽切片。
  temporal.actionmixed-auto-roi-v2:
    family: temporal
    format: actionmixed_bbox
    dataset_version: cleansight-actionmixed-auto-roi-v2
    revision: 6375eba95c28b206207e607bb407f45ab589cda0015305df635aa9f686e1b3ad
    data_root: datasets/cleansight-ActionMixed-auto-lhh
    feature_mapping: actionmixed-roi-grid-v2
    feature_layout:
      channels: 3
      groups:
        - classes: [hand, scope_control_body, scope_mid_section]
          rows: 3
          cols: 3
        - classes: [scope_distal_end, syringe, air_gun, short_brush, brush_tip_out]
          rows: 1
          cols: 1
    input_dim: 96
    labels: [idle, water_injection, flush, long_brush_insert, long_brush_withdraw, short_brush_cleaning]
    split_overlap_policy: frame

  # ROI 分组布局的**更高空间分辨率**版（2026-09-29 帧准确率攻关第 4 轮）：与
  # `temporal.actionmixed-auto-roi-v2` **只差高频类的网格**（3×3 → 4×4，每类 27 → 48 维），
  # 低频 5 类同样压缩为全局 1 区域 × 3 通道。共 3×48 + 5×3 = **159 维**
  # （recipe 见 framework/cleansight_eval/temporal/features/roi_bbox_v3.py）。
  #
  # 立项依据：实测发现帧准确率的杠杆是**"把维度预算花在有证据的类上"**——同一份数据、
  # 同一模型与预算下，v2（3×3）与"v2 再遮掉低频类"相对 v1（2×3，144 维）分别
  # **+2.37pp / +2.82pp（8/8 胜，Wilcoxon p=0.0078）**，而 v2 与 v2-nocold 彼此
  # **无显著差异（p=0.5469）**→ 增益来自高频类的空间分辨率，与低频类是否保留无关。
  # 本版把该变量继续外推一档（4×4），是相对 v2 的**单变量**对照。
  #
  # **每类块宽不等（48/3）**，遮罩/随机遮罩必须用
  # `features.roi_grid_v3_block_dims` 的显式块宽切片（按总维÷类数推导会静默遮错列）。
  temporal.actionmixed-auto-roi-v3:
    family: temporal
    format: actionmixed_bbox
    dataset_version: cleansight-actionmixed-auto-roi-v3
    revision: 6375eba95c28b206207e607bb407f45ab589cda0015305df635aa9f686e1b3ad
    data_root: datasets/cleansight-ActionMixed-auto-lhh
    feature_mapping: actionmixed-roi-grid-v3
    feature_layout:
      channels: 3
      groups:
        - classes: [hand, scope_control_body, scope_mid_section]
          rows: 4
          cols: 4
        - classes: [scope_distal_end, syringe, air_gun, short_brush, brush_tip_out]
          rows: 1
          cols: 1
    input_dim: 159
    labels: [idle, water_injection, flush, long_brush_insert, long_brush_withdraw, short_brush_cleaning]
    split_overlap_policy: frame

  # **通道语义替换**版（2026-09-29 帧准确率攻关第 6 轮）：布局与 `-roi-v2` 逐项一致
  # （高频 3 类 3×3 网格、低频 5 类全局 1 区），只把**冗余的 `presence` 通道**换成
  # 「最大面积框的宽、高」→ 每类块 = 区域数 × 4 通道，共 3×36 + 5×4 = **128 维**
  # （recipe 见 framework/cleansight_eval/temporal/features/roi_bbox_v4.py）。
  #
  # 立项依据（源域实测，与 test 无关）：v2 的 `presence ≡ count>0` **完全冗余**
  # （`2ch(count+max_area)` 与 `3ch` 的逐折 Δ 完全相同），而 `max_area` 不可省
  # （去掉 −2.63pp）→ 每个区域的有效信息只有 2 个数，空槽位应放新信息。
  # 源域 11 种通道组合的筛选中，本版（`count,max_area,w,h`）为一致性最好者：
  # 相对 `p,c,a` **+0.82pp、8/2 胜、p=0.084**。`max_area = w×h` 丢了**长宽比**，
  # 而器械的形状是有判别力的（细长内镜 vs 方正刷子）。
  #
  # **每类块宽不等（36/4）**，遮罩须用 `features.roi_grid_v4_block_dims` 显式块宽切片。
  temporal.actionmixed-auto-roi-v4:
    family: temporal
    format: actionmixed_bbox
    dataset_version: cleansight-actionmixed-auto-roi-v4
    revision: 6375eba95c28b206207e607bb407f45ab589cda0015305df635aa9f686e1b3ad
    data_root: datasets/cleansight-ActionMixed-auto-lhh
    feature_mapping: actionmixed-roi-grid-v4
    feature_layout:
      channels: 4
      groups:
        - classes: [hand, scope_control_body, scope_mid_section]
          rows: 3
          cols: 3
        - classes: [scope_distal_end, syringe, air_gun, short_brush, brush_tip_out]
          rows: 1
          cols: 1
    input_dim: 128
    labels: [idle, water_injection, flush, long_brush_insert, long_brush_withdraw, short_brush_cleaning]
    split_overlap_policy: frame

  # **数据版本 v3.1（2026-09-28 标注修订）**：上游 ModelScope `lhh010/cleansight-ActionMixed-auto`
  # 更新后于 2026-10-01 克隆到 `datasets/cleansight-ActionMixed-auto-v31`（**与 v3 并列保留，
  # 不覆盖 `-lhh`** —— v3 条目钉住 2026-09 全部历史 run 的复现性）。
  #
  # 与 v3（`-lhh`）的**实测差异**（逐文件 sha256 + 逐行比对，脚本见 usage/FEATURE_EVAL_RUNBOOK 同类做法）：
  #   · **test：8 视频逐字节未改**（标签与 `frames/` 检测框都相同）→ 跨版本 test 读数**同尺子可比**；
  #   · train：−#198（`f173153a`，遮挡严重的 flush，移入 `occlusion/`）
  #            +#203（`f809e944`，补录，266 帧 / flush 52）；
  #     标签改动：#201（`39da2635`）**194/294 帧 = 66%**、#205（`c1367d51`）125 帧、
  #     #202（`4cc6a009`）36 帧、#193/#194（`071eb2d6`）14 帧；
  #     另有 8 个 train + 2 个 val 文件为**仅换行符**（CRLF→LF）差异，标签内容逐行相同；
  #   · val：4→3（−#207（`152453e5`，只有已废弃动作 water_injection，移入 `deprecated/`）），
  #     `e8ea5bb7` 改 1 帧；
  #   · `frames/`（YOLO 自动检测框）**全部视频未变** → 特征差异只来自动作标签侧；
  #   · `water_injection` 在 train/val 已无正样本（该类识别废弃，id 位置保留）。
  #
  # ⚠️ **选点风险**：val 由 4 视频降为 **3 视频**，`best_metric=val_edit` 的选点噪声进一步变大
  # （参见 docs/EVAL.md 的选点体检：val 只有 4 视频时 val_f1@0.5 与 test 的 ρ 仅 0.199）。
  #
  # revision 口径同其它条目 = **三个 split manifest 拼接内容的 sha256**。
  temporal.actionmixed-auto-v31:
    family: temporal
    format: actionmixed_bbox
    dataset_version: cleansight-actionmixed-auto-v31
    revision: 875d73d168ca95e8ba2b2e5d0ee9fc97e9a73f7dabaaa45a48eb51aa10f7c313
    data_root: datasets/cleansight-ActionMixed-auto-v31
    feature_mapping: actionmixed-bbox-8cls-v1
