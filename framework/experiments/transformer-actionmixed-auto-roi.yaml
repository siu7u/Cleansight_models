# Transformer 全序列正式训练配置（ROI 空间特征，自动标注数据 cleansight-ActionMixed-auto）。
# 与 transformer-actionmixed-auto.yaml（40 维 bbox 契约）同模型同超参，仅特征契约不同：
# feature_mapping=actionmixed-roi-grid-v1 把画面按 2×3 网格分为 6 个区域，对每
# (检测类, 区域) 统计 [presence, count, max_area]，8 类 × 6 区域 × 3 通道 = 144 维
# （recipe 见 framework/cleansight_eval/temporal/features/roi_bbox.py）。
# 数据集登记 temporal.actionmixed-auto-roi-v1（同一份原始数据，独立特征契约，
# revision 与 v3 相同）；用于与 40 维基线对照"空间分区信息"对动作识别的影响。
# max_len 语义与 transformer-actionmixed-auto.yaml 一致（覆盖 v3 最长约 1635 帧）。

schema_version: 1
pipeline: full_sequence_temporal

model:
  type: transformer
  input_dim: 144         # 8 检测类 × 6 区域 × [presence, count, max_area]
  num_classes: 6         # idle/water_injection/flush/long_brush_insert/long_brush_withdraw/short_brush_cleaning
  d_model: 64            # Transformer 内部表示维度
  nhead: 4               # 注意力头数，必须整除 d_model
  num_layers: 2          # Encoder 层数
  dim_feedforward: 128   # 前馈层维度
  dropout: 0.1
  max_len: 2560          # 覆盖 auto 数据最长序列（v3 约 1635 帧，保留余量）

data:
  dataset_ref: temporal.actionmixed-auto-roi-v1  # 根目录、类别、mapping 和 manifest 由 benchmark catalog 解析
  split_train: train
  split_val: val
  split_eval: test

feature_schema:
  dim: 144
  version: actionmixed-roi-grid-v1
  # 每 18 维一类（6 区域 × 3 通道，区域按行优先），类顺序同 frames/data.yaml：
  # hand, scope_control_body, scope_mid_section, scope_distal_end,
  # syringe, air_gun, short_brush, brush_tip_out。

evaluation:
  mode: formal
  visualize: true

train:
  epochs: 30
  lr: 0.0005
  grad_clip: 1.0
  # 全序列以 batch_size=1 逐条喂入，支持变长序列。
