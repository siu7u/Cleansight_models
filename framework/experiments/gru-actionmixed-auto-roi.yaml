# GRU 滑窗正式训练配置（ROI 空间特征，自动标注数据 cleansight-ActionMixed-auto）。
# ⚠️ 本文档是【正式训练方案】配置（见 docs/features/IMAGE_FEATURE_TRAINING.md §3.4）：
# 健康配方（weight_decay/dropout/patience/段级 best 指标）已固化为默认值——
# 直接运行即可，不需要 -S 覆盖；坍缩诊断与配方依据见 FEATURE_STRATEGY_COMPARE.md。
# feature_mapping=actionmixed-roi-grid-v1：2×3 网格，每 (检测类,区域) 统计
# [presence, count, max_area]，8 类 × 6 区域 × 3 通道 = 144 维
# （recipe 见 framework/cleansight_eval/temporal/features/roi_bbox.py）。
# 数据集登记 temporal.actionmixed-auto-roi-v1（同一份原始数据，独立特征契约，
# revision 与 v3 相同）；正式训练建议多 seed（42/7/2026）取中位数评估。

schema_version: 1
pipeline: sliding_window_temporal

model:
  type: gru              # 因果模型，可用于滑窗；规模由本段超参表达
  input_dim: 144         # 8 检测类 × 6 区域 × [presence, count, max_area]
  num_classes: 6         # idle/water_injection/flush/long_brush_insert/long_brush_withdraw/short_brush_cleaning
  hidden: 128
  num_layers: 3
  dropout: 0.2           # 层间 dropout（坍缩诊断的配方修复，0059eb9）

data:
  dataset_ref: temporal.actionmixed-auto-roi-v1  # 根目录、类别、mapping 和 manifest 由 benchmark catalog 解析
  split_train: train
  split_val: val
  split_eval: test

feature_schema:
  dim: 144
  version: actionmixed-roi-grid-v1
  # 每 18 维一类（6 区域 × 3 通道，区域按行优先），类顺序同 frames/data.yaml：
  # hand, scope_control_body, scope_mid_section, scope_distal_end,
  # syringe, air_gun, short_brush, brush_tip_out。

evaluation:
  mode: formal
  visualize: true

train:
  epochs: 20
  lr: 0.001
  batch_size: 32
  window: 16          # 必须 ≤ 最短视频的采样帧数（auto v3 数据最短约 195 帧）
  weight_decay: 0.0001   # 健康配方（下同，见文档 §3.4）
  patience: 4            # 按 val_loss 早停
  best_metric: val_f1_0.5  # 段级指标选 best.pt（val_acc 会偏爱 idle 坍缩解）
