# MS-TCN 全序列正式训练配置（自动标注特征数据 cleansight-ActionMixed-auto）。
# 数据来自 annotate convert 生成的 datasets/cleansight-ActionMixed-auto：
# 检测特征由 YOLO 自动标注产生（仅覆盖 6 类，short_brush/brush_tip_out 恒零），
# 动作标签来自人工 Label Studio timelinelabels。
# 与 smoke 配置（mstcn-autoannotate-smoke.yaml）的区别：登记 dataset_ref、
# evaluation.mode=formal（正式评估）、epochs 扩到 30。
# 注意：数据集登记 temporal.actionmixed-auto-v2 及 train/val/test manifest
# 随数据扩量一起落地（见 docs/AUTO_ANNOTATION.md 完整工作流）。

schema_version: 1
pipeline: full_sequence_temporal

model:
  type: mstcn            # 双向非因果，只能进全序列流水线
  input_dim: 40          # 8 检测类 × [presence, cx, cy, w, h]
  num_classes: 6         # idle/air_injection/flush/long_brush_insert/long_brush_withdraw/short_brush_cleaning
  hidden: 32

data:
  dataset_ref: temporal.actionmixed-auto-v2  # 根目录、类别、mapping 和 manifest 由 benchmark catalog 解析
  split_train: train
  split_val: val
  split_eval: test

feature_schema:
  dim: 40
  version: actionmixed-bbox-8cls-v1
  # 布局同 GRU 实验：每 5 维一类，顺序同 frames/data.yaml。

evaluation:
  mode: formal
  visualize: true

train:
  epochs: 30
  lr: 0.002
  grad_clip: 5.0
