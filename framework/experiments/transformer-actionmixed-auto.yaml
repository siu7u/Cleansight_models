# Transformer 全序列正式训练配置（自动标注特征数据 cleansight-ActionMixed-auto）。
# 数据来自 annotate convert 生成的 datasets/cleansight-ActionMixed-auto：
# 检测特征由 YOLO 自动标注产生（yolo11s-g1-v1/yolo11s-g2-v1，8 类全非零），
# 动作标签来自人工 Label Studio timelinelabels。
# 与历史 transformer-actionmixed.yaml（人工标注数据）同结构，唯一差异：
# max_len 从 2048 提到 2560 —— v2 时代最长视频 a2ade960 按 7.5fps 抽样约 2080 帧，
# 超过 2048 会触发模型报错；v3 最长（9c0f89a1）约 1635 帧，2560 继续保留余量。
# 注意：数据集登记 temporal.actionmixed-auto-v3 及 train/val/test manifest
# 随数据扩量一起落地（见 docs/AUTO_ANNOTATION.md 完整工作流）。

schema_version: 1
pipeline: full_sequence_temporal

model:
  type: transformer
  input_dim: 40          # 8 检测类 × [presence, cx, cy, w, h]
  num_classes: 6         # idle/water_injection/flush/long_brush_insert/long_brush_withdraw/short_brush_cleaning
  d_model: 64            # Transformer 内部表示维度
  nhead: 4               # 注意力头数，必须整除 d_model
  num_layers: 2          # Encoder 层数
  dim_feedforward: 128   # 前馈层维度
  dropout: 0.1
  max_len: 2560          # 覆盖 auto 数据最长序列（v3 约 1635 帧，保留余量）

data:
  dataset_ref: temporal.actionmixed-auto-v3  # 根目录、类别、mapping 和 manifest 由 benchmark catalog 解析
  split_train: train
  split_val: val
  split_eval: test

feature_schema:
  dim: 40
  version: actionmixed-bbox-8cls-v1
  # 每 5 维一类，顺序同 frames/data.yaml：
  # hand, scope_control_body, scope_mid_section, scope_distal_end,
  # syringe, air_gun, short_brush, brush_tip_out。

evaluation:
  mode: formal
  visualize: true

train:
  epochs: 30
  lr: 0.0005
  grad_clip: 1.0
  # 全序列以 batch_size=1 逐条喂入，支持变长序列。
