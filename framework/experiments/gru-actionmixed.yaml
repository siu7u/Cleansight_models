# GRU 滑窗时序参照实验（消费真实 cleansight-ActionMixed 数据集）。
# 历史滑窗流水线：训练与评估都逐窗喂入、末帧监督、因果平滑推理，并测单 tick 延迟。
# 数据按 features 契约（bbox→40维）读入，用数据集内建的 train/val/test 目录切分。

schema_version: 1
pipeline: sliding_window_temporal

model:
  type: gru              # 因果模型，可用于滑窗；规模由本段超参表达
  input_dim: 40          # 8 检测类 × [presence, cx, cy, w, h]
  num_classes: 6         # labels/data.yaml: idle/air_injection/flush/long_brush_insert/long_brush_withdraw/short_brush_cleaning
  hidden: 128
  num_layers: 3

data:
  name: cleansight-ActionMixed
  root: ../../yolo-detection/pipeline/raw/modelscope/cleansight-ActionMixed
  action_mapping: labels/data.yaml   # YAML: action_id -> 名称
  labels_dir: labels                 # labels/<split>/<video>.mp4.txt : "frame_id action_id"
  frames_dir: frames                 # frames/<split>/<video>-<frame:06d>.txt : bbox → 40维特征
  split_train: train                 # 直接用内建目录，不用 idx
  split_val: val                     # 训练期选择 best.pt，不占用 test
  split_eval: test                   # 评估用哪个目录（train/val/test）

feature_schema:
  dim: 40
  version: actionmixed-bbox-8cls-v1
  # 布局：每 5 维一类，顺序同 frames/data.yaml（hand, scope_control_body, scope_mid_section,
  # scope_distal_end, syringe, air_gun, short_brush, brush_tip_out），每类 [presence, cx, cy, w, h]。

evaluation:
  testset_id: temporal.actionmixed-v1.test

train:
  epochs: 20
  lr: 0.001
  batch_size: 32
  window: 16          # 必须 ≤ 最短视频的采样帧数（本数据集最短约 35 帧）
