# GRU 滑窗正式训练配置（自动标注特征数据 cleansight-ActionMixed-auto）。
# 数据来自 annotate convert 生成的 datasets/cleansight-ActionMixed-auto：
# 检测特征由 YOLO 自动标注产生（仅覆盖 6 类，short_brush/brush_tip_out 恒零），
# 动作标签来自人工 Label Studio timelinelabels。
# 滑窗流水线：训练与评估都逐窗喂入、末帧监督、因果平滑推理，并测单 tick 延迟；
# 与历史 gru-actionmixed.yaml（人工标注数据）同模型同超参，便于对照自动标注代价。
# 注意：数据集登记 temporal.actionmixed-auto-v3 及 train/val/test manifest
# 随数据扩量一起落地（见 docs/AUTO_ANNOTATION.md 完整工作流）。

schema_version: 1
pipeline: sliding_window_temporal

model:
  type: gru              # 因果模型，可用于滑窗；规模由本段超参表达
  input_dim: 40          # 8 检测类 × [presence, cx, cy, w, h]
  num_classes: 6         # idle/air_injection/flush/long_brush_insert/long_brush_withdraw/short_brush_cleaning
  hidden: 128
  num_layers: 3

data:
  dataset_ref: temporal.actionmixed-auto-v3  # 根目录、类别、mapping 和 manifest 由 benchmark catalog 解析
  split_train: train
  split_val: val
  split_eval: test

feature_schema:
  dim: 40
  version: actionmixed-bbox-8cls-v1
  # 每 5 维一类，顺序同 frames/data.yaml：
  # hand, scope_control_body, scope_mid_section, scope_distal_end,
  # syringe, air_gun, short_brush, brush_tip_out。

evaluation:
  mode: formal
  visualize: true

train:
  epochs: 20
  lr: 0.001
  batch_size: 32
  window: 16          # 必须 ≤ 最短视频的采样帧数（auto 数据最短约 35 帧）
