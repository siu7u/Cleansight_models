# GRU + v2⊕v3 拼接对照（exploratory 探针，docs/FEATURE_LAB_NEXT_STEPS.md §1.1-#2b）：
# clean_bbox_v2（113 维绝对坐标，边界定位强 F1@0.25 24.00）⊕ clean_bbox_v3（113 维
# scope 相对坐标系，段识别强 edit 31.07）= 226 维，验证指标方向互补能否叠加。
# 与 §6/§7 矩阵同模型同健康配方同数据。契约 actionmixed-cleanv2v3-concat-v1
# （features/clean_v2_v3.py）；226 维不合 catalog 维度规则，探针阶段用显式 data.root。

schema_version: 1
pipeline: sliding_window_temporal

model:
  type: gru
  input_dim: 226
  num_classes: 6
  hidden: 128
  num_layers: 3
  dropout: 0.2

data:
  root: E:/曦源/Cleansight_models/datasets/cleansight-ActionMixed-auto
  split_train: train
  split_val: val
  split_eval: val

feature_schema:
  dim: 226
  version: actionmixed-cleanv2v3-concat-v1
  detection_confidence_default: 1.0   # v2 子版本由 recipe 默认（clean_bbox_v2_top1_impute）

evaluation:
  mode: exploratory
  visualize: false

train:
  epochs: 20
  lr: 0.001
  batch_size: 32
  window: 16
  weight_decay: 0.0001
  patience: 4
  best_metric: val_f1_0.5