# YOLO large-object detector evaluation config.

schema_version: 1
pipeline: detection

model:
  type: yolo
  weights: yolo11n.pt
  imgsz: 640
  allow_missing_meta: true

data:
  name: group1_large
  data_yaml: ../../datasets/yolo/group1_large/data.yaml
  eval_split: val

evaluation:
  mode: exploratory
  testset_id: yolo.group1_large.val
  save_predictions: true

train:
  epochs: 100
  batch: 16
  patience: 20
