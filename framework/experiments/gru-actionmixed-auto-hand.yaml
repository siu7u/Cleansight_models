# GRU 滑窗正式训练配置（手部区域特征，自动标注数据 cleansight-ActionMixed-auto）。
# 与 gru-actionmixed-auto.yaml（整个画面 40 维 bbox 契约）同模型同超参，仅特征契约不同：
# feature_mapping=actionmixed-bbox-hand-8cls-v1 只编码中心落在"面积最大 hand 框扩张
# 1.5 倍"区域内的框（坐标相对该区域归一化），仍为 8×5=40 维；无 hand 框时全零
# （recipe 见 framework/cleansight_eval/temporal/features/hand_bbox.py）。
# 数据集登记 temporal.actionmixed-auto-hand-v1（同一份原始数据，独立特征契约，
# revision 与 v3 相同）；用于与"整个画面"和"全局+手部"策略横向对比。

schema_version: 1
pipeline: sliding_window_temporal

model:
  type: gru              # 因果模型，可用于滑窗；规模由本段超参表达
  input_dim: 40          # 8 检测类 × [presence, cx_rel, cy_rel, w_rel, h_rel]（相对手部区域）
  num_classes: 6         # idle/water_injection/flush/long_brush_insert/long_brush_withdraw/short_brush_cleaning
  hidden: 128
  num_layers: 3

data:
  dataset_ref: temporal.actionmixed-auto-hand-v1  # 根目录、类别、mapping 和 manifest 由 benchmark catalog 解析
  split_train: train
  split_val: val
  split_eval: test

feature_schema:
  dim: 40
  version: actionmixed-bbox-hand-8cls-v1
  # 每 5 维一类，类顺序同 frames/data.yaml：
  # hand, scope_control_body, scope_mid_section, scope_distal_end,
  # syringe, air_gun, short_brush, brush_tip_out。

evaluation:
  mode: formal
  visualize: true

train:
  epochs: 20
  lr: 0.001
  batch_size: 32
  window: 16          # 必须 ≤ 最短视频的采样帧数（auto v3 数据最短约 195 帧）
