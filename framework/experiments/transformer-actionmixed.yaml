# Transformer 全序列时序实验配置（模型注册后使用）。
# Transformer Encoder 默认使用完整序列上下文，属于非因果模型；评估时使用 full_sequence_temporal。

schema_version: 1
pipeline: full_sequence_temporal

model:
  type: transformer
  input_dim: 40          # 8 检测类 × [presence, cx, cy, w, h]
  num_classes: 6         # idle/air_injection/flush/long_brush_insert/long_brush_withdraw/short_brush_cleaning
  d_model: 64            # Transformer 内部表示维度
  nhead: 4               # 注意力头数，必须整除 d_model
  num_layers: 2          # Encoder 层数
  dim_feedforward: 128   # 前馈层维度
  dropout: 0.1
  max_len: 2048          # 覆盖当前最长序列（约 1000 帧）

data:
  name: cleansight-ActionMixed
  root: ../../yolo-detection/pipeline/raw/modelscope/cleansight-ActionMixed
  action_mapping: labels/data.yaml
  labels_dir: labels
  frames_dir: frames
  split_train: train
  split_val: val
  split_eval: test

feature_schema:
  dim: 40
  version: actionmixed-bbox-8cls-v1
  # 每 5 维一类，顺序同 frames/data.yaml：
  # hand, scope_control_body, scope_mid_section, scope_distal_end,
  # syringe, air_gun, short_brush, brush_tip_out。

evaluation:
  testset_id: temporal.actionmixed-v1.test

train:
  epochs: 30
  lr: 0.0005
  grad_clip: 1.0
  # 全序列以 batch_size=1 逐条喂入，支持变长序列。
