# MS-TCN 全序列正式训练配置（ROI 空间特征，自动标注数据 cleansight-ActionMixed-auto）。
# 与 mstcn-actionmixed-auto.yaml（40 维 bbox 契约）同模型同超参，仅特征契约不同：
# feature_mapping=actionmixed-roi-grid-v1 把画面按 2×3 网格分为 6 个区域，对每
# (检测类, 区域) 统计 [presence, count, max_area]，8 类 × 6 区域 × 3 通道 = 144 维
# （recipe 见 framework/cleansight_eval/temporal/features/roi_bbox.py）。
# 数据集登记 temporal.actionmixed-auto-roi-v1（同一份原始数据，独立特征契约，
# revision 与 v3 相同）；用于与 40 维基线对照"空间分区信息"对动作识别的影响。

schema_version: 1
pipeline: full_sequence_temporal

model:
  type: mstcn            # 双向非因果，只能进全序列流水线
  input_dim: 144         # 8 检测类 × 6 区域 × [presence, count, max_area]
  num_classes: 6         # idle/water_injection/flush/long_brush_insert/long_brush_withdraw/short_brush_cleaning
  hidden: 32

data:
  dataset_ref: temporal.actionmixed-auto-roi-v1  # 根目录、类别、mapping 和 manifest 由 benchmark catalog 解析
  split_train: train
  split_val: val
  split_eval: test

feature_schema:
  dim: 144
  version: actionmixed-roi-grid-v1
  # 每 18 维一类（6 区域 × 3 通道，区域按行优先），类顺序同 frames/data.yaml。

evaluation:
  mode: formal
  visualize: true

train:
  epochs: 30
  lr: 0.002
  grad_clip: 5.0
