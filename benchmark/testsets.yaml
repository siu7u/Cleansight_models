schema_version: 1
root: ..

testsets:
  temporal.endo-project-v1.train:
    family: temporal
    dataset_version: endo-project-v1
    split: train
    manifest: temporal-gru/data/Endo_Project/splits/train.split1.bundle
    data_root: temporal-gru/data/Endo_Project
    feature_mapping: legacy-20d-v1
    input_dim: 20
    labels: [Idle, Long_Brushing, Short_Brushing]
    purpose: training_only
    expected_items:
      - export9
      - export14
      - export4
      - export13
      - export18
      - export3
      - export5
      - export8
      - export15-480P
      - export20
      - export7-480p
      - export19
      - export10
      - export2
      - export11
      - export6

  temporal.endo-project-v1.test:
    family: temporal
    dataset_version: endo-project-v1
    split: test
    manifest: temporal-gru/data/Endo_Project/splits/test.split1.bundle
    data_root: temporal-gru/data/Endo_Project
    feature_mapping: legacy-20d-v1
    input_dim: 20
    labels: [Idle, Long_Brushing, Short_Brushing]
    purpose: locked_holdout_benchmark
    expected_items:
      - export16-480P
      - export17
      - export1
      - export12

  yolo.group1_large.test:
    family: yolo
    dataset_version: cleansight-actionmixed-detection-v1
    split: test
    manifest: yolo-detection/pipeline/datasets/group1_large/data.yaml
    feature_mapping: yolo-bbox-group1-v1
    input_dim: 3
    labels: [hand, scope_control_body, scope_mid_section]
    purpose: locked_holdout_benchmark

  yolo.group2_small.test:
    family: yolo
    dataset_version: cleansight-actionmixed-detection-v1
    split: test
    manifest: yolo-detection/pipeline/datasets/group2_small/data.yaml
    feature_mapping: yolo-bbox-group2-v1
    input_dim: 3
    labels: [syringe, air_gun, scope_distal_end]
    purpose: locked_holdout_benchmark

  e2e.clean-example.smoke:
    family: e2e
    dataset_version: clean-e2e-example-v1
    split: smoke
    manifest: benchmark/e2e_3min/cases/example.yaml
    feature_mapping: action-timeline-v1
    input_dim: null
    labels: [Long_Brushing, Short_Brushing]
    purpose: schema_smoke_only
