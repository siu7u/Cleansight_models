# 后端 CLEAN BiLSTM + MS-TCN best checkpoint 的探索性统一评测配置。
schema_version: 1
pipeline: full_sequence_temporal

model:
  type: clean_mstcn_bilstm
  input_dim: 113
  num_classes: 6
  hidden: 64
  lstm_layers: 2
  tcn_layers: 6
  refine_stages: 2
  dropout: 0.15
  allow_missing_meta: true

data:
  name: actionmixed-clean-mstcn-bilstm-exploratory
  root: ../../cleansight-ActionMixed
  split_train: train
  split_val: val
  split_eval: test
  fps: 7.5

feature_schema:
  dim: 113
  version: clean_bbox_v2_top1_impute
  class_order: [idle, long_brush_insert, long_brush_withdraw, short_brush_cleaning, flush, air_injection]
  layout: backend-clean-bbox-v2
  normalization: checkpoint-zscore
  detection_confidence_default: 1.0

evaluation:
  mode: exploratory
  visualize: true

train:
  epochs: 3
  lr: 0.001
  batch_size: 1
