# 后端 CLEAN ASFormer best checkpoint 的探索性统一评测配置。
schema_version: 1
pipeline: full_sequence_temporal

model:
  type: clean_asformer
  input_dim: 121
  num_classes: 6
  hidden: 64
  nhead: 4
  num_layers: 4
  dropout: 0.15
  allow_missing_meta: true

data:
  name: actionmixed-clean-asformer-exploratory
  root: ../../cleansight-ActionMixed
  split_train: train
  split_val: val
  split_eval: test
  fps: 7.5

feature_schema:
  dim: 121
  version: clean_bbox_v2_top1_impute+business_priors
  class_order: [idle, long_brush_insert, long_brush_withdraw, short_brush_cleaning, flush, air_injection]
  layout: backend-clean-bbox-v2
  normalization: checkpoint-zscore
  # 当前数据是五列 bbox 标注，不含 YOLO confidence；固定1.0仅用于 exploratory 对比。
  detection_confidence_default: 1.0

evaluation:
  mode: exploratory
  visualize: true

train:
  epochs: 3
  lr: 0.001
  batch_size: 1
